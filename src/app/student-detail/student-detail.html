<a class="back-link" routerLink="/">← Back to directory</a>

@if (isLoading) {
  <p class="status-message">Loading student...</p>
}

@if (errorMessage) {
  <p class="status-message error-message">{{ errorMessage }}</p>
}

@if (student) {
  <section class="profile-hero">
    <p class="eyebrow">Student record</p>
    <h1>{{ student.name }}</h1>
    <p class="handle">Current student record</p>
  </section>

  <section class="profile-grid">
    <div class="profile-column">
      <p class="detail-label">Student name</p>
      <p class="large-value">{{ student.name }}</p>
    </div>
    <div class="profile-column">
      <p class="detail-label">Score</p>
      <p class="score-value">{{ student.score }}<span> / 100</span></p>
    </div>
    <div class="profile-column">
      <p class="detail-label">Status</p>
      <p class="large-value">Active</p>
    </div>
  </section>
}
